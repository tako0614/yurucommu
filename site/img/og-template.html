<!doctype html>
<!--
  OG card source for yurucommu.com (1200x630). Rendered to og.png by loading this
  file in a 1200x630 viewport and screenshotting it. Edit here, then regenerate.
  Copy mirrors the landing hero; the screen is the real mobile capture
  (../assets/shots/yurucommu-mobile.webp), shown as-is with a hairline border.
-->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../tokens.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        gap: 56px;
        padding: 64px 80px 0 80px;
        background: var(--color-night);
        color: var(--color-white);
        font-family: var(--font-display);
      }
      .copy {
        display: flex;
        flex-direction: column;
        padding-bottom: 56px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: var(--color-night-panel);
        font-size: 34px;
        font-weight: 900;
      }
      h1 {
        margin-top: 56px;
        font-size: 56px;
        font-weight: 900;
        line-height: 1.3;
        letter-spacing: -0.01em;
      }
      .lead {
        margin-top: 24px;
        font-size: 26px;
        font-weight: 500;
        line-height: 1.6;
        color: var(--color-night-muted);
      }
      .site {
        margin-top: auto;
        font-family: var(--font-mono);
        font-size: 22px;
        color: var(--color-night-muted);
      }
      figure {
        align-self: start;
        margin-top: 24px;
        overflow: hidden;
        /* Stops above the capture's floating post button. */
        height: 500px;
        border: 1px solid var(--color-night-rule);
        border-radius: 24px;
      }
      figure img {
        display: block;
        width: 280px;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand"><span class="mark">ゆ</span>yurucommu</div>
      <h1>投稿、ストーリー、DM。<br />自分で運用できるSNS。</h1>
      <p class="lead">
        ActivityPub に対応した別のサーバーとも<br />つながれます。
      </p>
      <p class="site">yurucommu.com</p>
    </div>
    <figure>
      <img src="../assets/shots/yurucommu-mobile.webp" alt="" />
    </figure>
  </body>
</html>
