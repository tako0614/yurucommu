<script>
  // Phones: the open page list covers the page under it. Escape closes it and
  // returns to its toggle; so does moving focus out of it (Tab past the last
  // link used to land on content hidden under the list). Wide screens keep
  // the list open and hide the toggle, so this does nothing there.
  (() => {
    const menu = document.currentScript.previousElementSibling.querySelector(
      "details.docs-menu",
    );
    const toggle = menu && menu.querySelector("summary");
    if (!toggle) return;
    const collapsible = () => getComputedStyle(toggle).display !== "none";
    // Wide screens show the list through CSS while the <details> stayed
    // closed, which accessibility checkers read as hidden content. Open it
    // where it cannot be collapsed, and close it when the screen narrows.
    const sync = () => {
      menu.open = !collapsible();
    };
    sync();
    window.matchMedia("(width > 900px)").addEventListener("change", sync);
    menu.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && menu.open && collapsible()) {
        menu.open = false;
        toggle.focus();
      }
    });
    menu.addEventListener("focusout", (e) => {
      const next = e.relatedTarget;
      if (menu.open && collapsible() && next && !menu.contains(next)) {
        menu.open = false;
      }
    });
  })();
</script>
