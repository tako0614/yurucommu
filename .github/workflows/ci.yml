name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: yurucommu-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.bun-cache
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pinned: v6.0.2
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # pinned: v2.0.2
        with:
          bun-version: 1.3.14

      - uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # pinned: v2
        with:
          tofu_version: 1.12.1
          tofu_wrapper: false

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # pinned: v6.0.0
        with:
          go-version: "1.26.5"
          cache: false

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # pinned: v5.0.5
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: ${{ runner.os }}-bun-yurucommu-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-yurucommu-

      - run: bun install --frozen-lockfile
      - name: Build the exact integrated Provider 3 candidate
        env:
          TAKOFORM_SOURCE_COMMIT: c08651d9b39d1be34e4b803c3d32fdca82e3653e
        run: |
          set -eu
          provider_root="$RUNNER_TEMP/takoform-provider"
          git init "$provider_root"
          git -C "$provider_root" remote add origin https://github.com/tako0614/terraform-provider-takoform.git
          git -C "$provider_root" fetch --depth=1 origin "$TAKOFORM_SOURCE_COMMIT"
          git -C "$provider_root" checkout --detach FETCH_HEAD
          test "$(git -C "$provider_root" rev-parse HEAD)" = "$TAKOFORM_SOURCE_COMMIT"
          go -C "$provider_root" build -trimpath -o "$RUNNER_TEMP/terraform-provider-takoform" .
          echo "TAKOFORM_PROVIDER_BINARY=$RUNNER_TEMP/terraform-provider-takoform" >> "$GITHUB_ENV"
          echo "TAKOFORM_PROVIDER_SHA256=sha256:$(sha256sum "$RUNNER_TEMP/terraform-provider-takoform" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"

      - run: bun run check
