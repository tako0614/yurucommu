name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: yurucommu-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.bun-cache
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pinned: v6.0.2
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # pinned: v2.0.2
        with:
          bun-version: 1.3.14

      - uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # pinned: v2
        with:
          tofu_version: 1.12.1
          tofu_wrapper: false

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # pinned: v5.0.5
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: ${{ runner.os }}-bun-yurucommu-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-yurucommu-

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run smoke:release-browser -- dist/yurucommu-worker.js
      - name: Qualify immutable v2.2.0 password and synthetic OIDC update and restore
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/tako0614/yurucommu/releases/download/v2.2.0/yurucommu-worker.js \
            --output "$RUNNER_TEMP/yurucommu-v2.2.0-worker.js"
          bun run smoke:release-update -- "$RUNNER_TEMP/yurucommu-v2.2.0-worker.js" dist/yurucommu-worker.js \
            > "$RUNNER_TEMP/yurucommu-update-result.json"
          bun -e 'const result = await Bun.file(Bun.argv.at(-1)).json(); if (result.kind !== "yurucommu.native-session-update-continuity@v1" || result.status !== "PASSED" || result.oidcLanes?.length !== 2 || result.oidcLanes.some(lane => lane.issuer.blocked !== 0 || lane.checks.length !== 12)) throw new Error("Native password/OIDC update result missing or failed"); console.log(JSON.stringify(result));' \
            "$RUNNER_TEMP/yurucommu-update-result.json"
